plugins {
    id 'fabric-loom' version '1.11.8'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base { archivesName = project.archives_base_name }

loom {
    splitEnvironmentSourceSets()
    runs {
        // Teste visual automatizado: ./gradlew runVisualTest  (ver art/tools/visual_test.sh)
        visualTest {
            client()
            name "Visual Test"
            runDir "run"
            property "velocity.visualtest", "true"
            programArgs "--quickPlaySingleplayer", "vt", "--width", "1280", "--height", "720"
        }
    }
    mods {
        "velocity" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test { useJUnitPlatform() }

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 21 }

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// ---------------------------------------------------------------------------
// Entrega: copia o jar final para releases/ com versão do mod + versão do jogo.
// Uso: ./gradlew release   →  releases/Velocity-Velo-<versão>-MC<versão-do-jogo>.jar
// ---------------------------------------------------------------------------
tasks.register('release', Copy) {
    group = 'velocity'
    description = 'Gera o jar remapeado e o coloca em releases/'
    dependsOn tasks.named('remapJar'), tasks.named('test')
    from(tasks.named('remapJar').flatMap { it.archiveFile })
    into(layout.projectDirectory.dir('releases'))
    rename { "Velocity-Velo-${project.mod_version}-MC${project.minecraft_version}.jar" }
}
